<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="patchgen logo">
  <style>
    .bg { fill: #4fc08d; }
    .fg { fill: #fff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #42b883; }
    }
  </style>
  <rect class="bg" width="100" height="100" rx="18"/>
  <g class="fg" transform="translate(18, 16)">
    <!-- Document icon with diff lines -->
    <rect x="8" y="0" width="48" height="68" rx="6" fill="none" stroke="#fff" stroke-width="4"/>
    <!-- Plus line -->
    <rect x="20" y="18" width="24" height="4" rx="2"/>
    <rect x="30" y="8" width="4" height="24" rx="2"/>
    <!-- Minus line -->
    <rect x="20" y="42" width="24" height="4" rx="2"/>
  </g>
</svg>
